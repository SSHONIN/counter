<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カウンター">
<meta name="theme-color" content="#0f0f0f">
<title>カウンター</title>
<script>
// PWA manifest (inline blob)
document.addEventListener('DOMContentLoaded', () => {
  const m = {
    name:"カウンター", short_name:"カウンター",
    start_url:"./", display:"standalone",
    background_color:"#0f0f0f", theme_color:"#0f0f0f",
    orientation:"portrait",
    icons:[
      {src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='%230f0f0f'/><text y='140' x='96' font-size='110' text-anchor='middle'>🚬</text></svg>",sizes:"192x192",type:"image/svg+xml"},
      {src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%230f0f0f'/><text y='370' x='256' font-size='290' text-anchor='middle'>🚬</text></svg>",sizes:"512x512",type:"image/svg+xml"}
    ]
  };
  const blob = new Blob([JSON.stringify(m)],{type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
});
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap');
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424;
  --border:#2e2e2e; --text:#e8e8e8; --muted:#666;
  --smoke:#c8b89a; --beer:#e8a020; --nonal:#5bbfaa;
  --accent:#ffffff; --danger:#ff4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Zen Kaku Gothic New',sans-serif;
  min-height:100vh;min-height:-webkit-fill-available;
  display:flex;flex-direction:column;
  max-width:420px;margin:0 auto;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
.header{
  padding:calc(24px + env(safe-area-inset-top)) 20px 16px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-end;
}
.header-title{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;font-family:'DM Mono',monospace;}
.header-date{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);}

.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface);}
.tab{flex:1;padding:12px;text-align:center;font-size:12px;letter-spacing:.1em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:'DM Mono',monospace;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.counters{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.counter-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;position:relative;overflow:hidden;transition:transform .08s;}
.counter-card:active{transform:scale(.99);}
.counter-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:12px 0 0 12px;}
.counter-card.smoke::before{background:var(--smoke);}
.counter-card.beer::before{background:var(--beer);}
.counter-card.nonal::before{background:var(--nonal);}

.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.card-label{display:flex;align-items:center;gap:8px;}
.card-icon{font-size:18px;}
.card-name{font-size:13px;font-weight:700;letter-spacing:.05em;}
.card-unit{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.card-price-hint{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}

.counter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.btn-minus,.btn-plus{
  width:52px;height:52px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-size:26px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .1s;flex-shrink:0;line-height:1;user-select:none;
}
.btn-minus:active,.btn-plus:active{transform:scale(.88);background:var(--border);}

.counter-value{flex:1;text-align:center;}
.count-num{font-size:48px;font-weight:900;font-family:'DM Mono',monospace;line-height:1;letter-spacing:-.02em;}
.counter-card.smoke .count-num{color:var(--smoke);}
.counter-card.beer  .count-num{color:var(--beer);}
.counter-card.nonal .count-num{color:var(--nonal);}
.count-cost{font-size:12px;font-family:'DM Mono',monospace;color:var(--muted);margin-top:2px;}

.total-section{margin:4px 16px 0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;}
.total-label{font-size:10px;letter-spacing:.15em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:6px;text-transform:uppercase;}
.total-amount{font-size:34px;font-weight:900;font-family:'DM Mono',monospace;letter-spacing:-.02em;}
.total-breakdown{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:4px;line-height:1.7;white-space:pre-line;}

.pwa-banner{
  margin:12px 16px 0;background:#1a2a1a;
  border:1px solid #2e4e2e;border-radius:10px;
  padding:12px 14px;font-size:11px;color:#8fbf8f;
  font-family:'DM Mono',monospace;line-height:1.6;display:none;
}
.pwa-banner.visible{display:block;}
.pwa-banner strong{color:#aedaae;}

.stats-panel{padding:16px;display:none;flex-direction:column;gap:12px;}
.stats-section-title{font-size:10px;letter-spacing:.15em;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;padding:0 4px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;}
.stat-period{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase;}
.stat-rows{display:flex;flex-direction:column;gap:4px;}
.stat-row{display:flex;justify-content:space-between;font-size:11px;font-family:'DM Mono',monospace;}
.stat-row .name{color:var(--muted);}
.stat-row .val{color:var(--text);}
.stat-cost{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;font-family:'DM Mono',monospace;font-weight:500;text-align:right;}

.settings-panel{padding:16px;display:none;flex-direction:column;gap:12px;}
.setting-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.setting-label{font-size:12px;font-weight:700;letter-spacing:.05em;}
.setting-sub{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.setting-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:15px;padding:10px 12px;width:100%;outline:none;}
.setting-input:focus{border-color:var(--accent);}
.btn-reset{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:12px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .15s;}
.btn-reset:active{background:var(--danger);color:#fff;}

.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:420px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:color .15s;user-select:none;}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:20px;}

@keyframes flash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.flash{animation:flash .15s ease;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">My Counter</div>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="tab-bar">
  <div class="tab active" data-tab="today">今日</div>
  <div class="tab" data-tab="stats">集計</div>
  <div class="tab" data-tab="settings">設定</div>
</div>

<!-- TODAY -->
<div id="panel-today">
  <div class="counters">
    <div class="counter-card smoke">
      <div class="card-header">
        <div class="card-label">
          <span class="card-icon">🚬</span>
          <div><div class="card-name">タバコ</div><div class="card-unit">本</div></div>
        </div>
        <div class="card-price-hint" id="smokePriceHint">¥31/本</div>
      </div>
      <div class="counter-row">
        <button class="btn-minus" onclick="change('smoke',-1)">−</button>
        <div class="counter-value">
          <div class="count-num" id="smokeCount">0</div>
          <div class="count-cost" id="smokeCost">¥0</div>
        </div>
        <button class="btn-plus" onclick="change('smoke',1)">＋</button>
      </div>
    </div>

    <div class="counter-card beer">
      <div class="card-header">
        <div class="card-label">
          <span class="card-icon">🍺</span>
          <div><div class="card-name">ビール</div><div class="card-unit">缶／本</div></div>
        </div>
        <div class="card-price-hint" id="beerPriceHint">¥500/缶</div>
      </div>
      <div class="counter-row">
        <button class="btn-minus" onclick="change('beer',-1)">−</button>
        <div class="counter-value">
          <div class="count-num" id="beerCount">0</div>
          <div class="count-cost" id="beerCost">¥0</div>
        </div>
        <button class="btn-plus" onclick="change('beer',1)">＋</button>
      </div>
    </div>

    <div class="counter-card nonal">
      <div class="card-header">
        <div class="card-label">
          <span class="card-icon">🥤</span>
          <div><div class="card-name">ノンアルビール</div><div class="card-unit">缶／本</div></div>
        </div>
        <div class="card-price-hint" id="nonalPriceHint">¥130/缶</div>
      </div>
      <div class="counter-row">
        <button class="btn-minus" onclick="change('nonal',-1)">−</button>
        <div class="counter-value">
          <div class="count-num" id="nonalCount">0</div>
          <div class="count-cost" id="nonalCost">¥0</div>
        </div>
        <button class="btn-plus" onclick="change('nonal',1)">＋</button>
      </div>
    </div>
  </div>

  <div class="total-section">
    <div class="total-label">今日の合計</div>
    <div class="total-amount" id="totalAmount">¥0</div>
    <div class="total-breakdown" id="totalBreakdown">—</div>
  </div>

  <div class="pwa-banner" id="pwaBanner">
    📱 <strong>ホーム画面に追加：</strong><br>
    Safari下部の「共有」ボタン →「ホーム画面に追加」でアプリとして使えます
  </div>
</div>

<!-- STATS -->
<div id="panel-stats" class="stats-panel">
  <div class="stats-section-title">週間・月間集計</div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-period">今週</div>
      <div class="stat-rows">
        <div class="stat-row"><span class="name">🚬</span><span class="val" id="w-smoke">0本</span></div>
        <div class="stat-row"><span class="name">🍺</span><span class="val" id="w-beer">0缶</span></div>
        <div class="stat-row"><span class="name">🥤</span><span class="val" id="w-nonal">0缶</span></div>
      </div>
      <div class="stat-cost" id="w-cost">¥0</div>
    </div>
    <div class="stat-card">
      <div class="stat-period">今月</div>
      <div class="stat-rows">
        <div class="stat-row"><span class="name">🚬</span><span class="val" id="m-smoke">0本</span></div>
        <div class="stat-row"><span class="name">🍺</span><span class="val" id="m-beer">0缶</span></div>
        <div class="stat-row"><span class="name">🥤</span><span class="val" id="m-nonal">0缶</span></div>
      </div>
      <div class="stat-cost" id="m-cost">¥0</div>
    </div>
  </div>
  <div class="stats-section-title" style="margin-top:4px">過去7日の記録</div>
  <div id="historyList" style="display:flex;flex-direction:column;gap:6px"></div>
</div>

<!-- SETTINGS -->
<div id="panel-settings" class="settings-panel">
  <div class="setting-row">
    <div class="setting-label">🚬 タバコ 単価</div>
    <div class="setting-sub">1本あたりの金額（円）</div>
    <input class="setting-input" type="number" id="smokePriceInput" value="31" min="1" oninput="savePrices()">
  </div>
  <div class="setting-row">
    <div class="setting-label">🍺 ビール 単価</div>
    <div class="setting-sub">1缶あたりの金額（円）</div>
    <input class="setting-input" type="number" id="beerPriceInput" value="500" min="1" oninput="savePrices()">
  </div>
  <div class="setting-row">
    <div class="setting-label">🥤 ノンアルビール 単価</div>
    <div class="setting-sub">1缶あたりの金額（円）</div>
    <input class="setting-input" type="number" id="nonalPriceInput" value="130" min="1" oninput="savePrices()">
  </div>
  <button class="btn-reset" onclick="resetToday()">今日のカウントをリセット</button>
  <button class="btn-reset" style="border-color:var(--muted);color:var(--muted)" onclick="resetAll()">全データを削除</button>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="today" onclick="switchNav('today')">
    <span class="nav-icon">○</span><span>カウント</span>
  </button>
  <button class="nav-btn" data-nav="stats" onclick="switchNav('stats')">
    <span class="nav-icon">≡</span><span>集計</span>
  </button>
  <button class="nav-btn" data-nav="settings" onclick="switchNav('settings')">
    <span class="nav-icon">⚙</span><span>設定</span>
  </button>
</nav>

<script>
const PRICE_DEFAULT={smoke:31,beer:500,nonal:130};
const dateKey=()=>new Date().toISOString().slice(0,10);

function loadData(){try{return JSON.parse(localStorage.getItem('ctr_data')||'{}')}catch{return {}}}
function saveData(d){localStorage.setItem('ctr_data',JSON.stringify(d))}
function loadPrices(){try{return{...PRICE_DEFAULT,...JSON.parse(localStorage.getItem('ctr_prices')||'{}')} }catch{return{...PRICE_DEFAULT}}}
function savePrices(){
  const p={
    smoke:Math.max(1,parseInt(document.getElementById('smokePriceInput').value)||PRICE_DEFAULT.smoke),
    beer: Math.max(1,parseInt(document.getElementById('beerPriceInput').value) ||PRICE_DEFAULT.beer),
    nonal:Math.max(1,parseInt(document.getElementById('nonalPriceInput').value)||PRICE_DEFAULT.nonal),
  };
  localStorage.setItem('ctr_prices',JSON.stringify(p));
  render();
}

function todayEntry(){
  const d=loadData(), k=dateKey();
  if(!d[k]) d[k]={smoke:0,beer:0,nonal:0};
  if(d[k].nonal===undefined) d[k].nonal=0;
  return {data:d,key:k};
}

function change(type,delta){
  const {data,key}=todayEntry();
  data[key][type]=Math.max(0,(data[key][type]||0)+delta);
  saveData(data);render();
  const el=document.getElementById(type+'Count');
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}

function fmt(n){return'¥'+n.toLocaleString('ja-JP')}

function render(){
  const prices=loadPrices();
  const {data,key}=todayEntry();
  const t=data[key];

  document.getElementById('smokePriceHint').textContent=fmt(prices.smoke)+'/本';
  document.getElementById('beerPriceHint').textContent =fmt(prices.beer) +'/缶';
  document.getElementById('nonalPriceHint').textContent=fmt(prices.nonal)+'/缶';

  document.getElementById('smokeCount').textContent=t.smoke;
  document.getElementById('beerCount').textContent =t.beer;
  document.getElementById('nonalCount').textContent=t.nonal;
  document.getElementById('smokeCost').textContent =fmt(t.smoke*prices.smoke);
  document.getElementById('beerCost').textContent  =fmt(t.beer *prices.beer);
  document.getElementById('nonalCost').textContent =fmt(t.nonal*prices.nonal);

  const total=t.smoke*prices.smoke+t.beer*prices.beer+t.nonal*prices.nonal;
  document.getElementById('totalAmount').textContent=fmt(total);
  const parts=[];
  if(t.smoke) parts.push('🚬 '+t.smoke+'本  '+fmt(t.smoke*prices.smoke));
  if(t.beer)  parts.push('🍺 '+t.beer +'缶  '+fmt(t.beer *prices.beer));
  if(t.nonal) parts.push('🥤 '+t.nonal+'缶  '+fmt(t.nonal*prices.nonal));
  document.getElementById('totalBreakdown').textContent=parts.join('\n')||'—';

  document.getElementById('smokePriceInput').value=prices.smoke;
  document.getElementById('beerPriceInput').value =prices.beer;
  document.getElementById('nonalPriceInput').value=prices.nonal;
  renderStats(data,prices);
}

function renderStats(data,prices){
  const now=new Date();
  let wS=0,wB=0,wN=0;
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    if(data[k]){wS+=data[k].smoke||0;wB+=data[k].beer||0;wN+=data[k].nonal||0;}
  }
  const mp=now.toISOString().slice(0,7);
  let mS=0,mB=0,mN=0;
  Object.keys(data).filter(k=>k.startsWith(mp)).forEach(k=>{
    mS+=data[k].smoke||0;mB+=data[k].beer||0;mN+=data[k].nonal||0;
  });
  document.getElementById('w-smoke').textContent=wS+'本';
  document.getElementById('w-beer').textContent =wB+'缶';
  document.getElementById('w-nonal').textContent=wN+'缶';
  document.getElementById('w-cost').textContent =fmt(wS*prices.smoke+wB*prices.beer+wN*prices.nonal);
  document.getElementById('m-smoke').textContent=mS+'本';
  document.getElementById('m-beer').textContent =mB+'缶';
  document.getElementById('m-nonal').textContent=mN+'缶';
  document.getElementById('m-cost').textContent =fmt(mS*prices.smoke+mB*prices.beer+mN*prices.nonal);

  const hist=document.getElementById('historyList');
  hist.innerHTML='';
  const days=['日','月','火','水','木','金','土'];
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    const e=data[k]||{smoke:0,beer:0,nonal:0};
    const cost=(e.smoke||0)*prices.smoke+(e.beer||0)*prices.beer+(e.nonal||0)*prices.nonal;
    const label=i===0?'今日':`${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
    const row=document.createElement('div');
    row.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-family:"DM Mono",monospace;font-size:11px;gap:6px;';
    row.innerHTML=`<span style="color:var(--muted);flex-shrink:0">${label}</span><span style="flex:1;text-align:center">🚬${e.smoke||0} 🍺${e.beer||0} 🥤${e.nonal||0}</span><span style="font-weight:500;flex-shrink:0">${fmt(cost)}</span>`;
    hist.appendChild(row);
  }
}

function resetToday(){
  if(!confirm('今日のカウントをリセットしますか？'))return;
  const {data,key}=todayEntry();data[key]={smoke:0,beer:0,nonal:0};saveData(data);render();
}
function resetAll(){
  if(!confirm('全データを削除します。よろしいですか？'))return;
  localStorage.removeItem('ctr_data');render();
}

// iOS PWA hint
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
if(isIOS&&!isStandalone) document.getElementById('pwaBanner').classList.add('visible');

const panels=['today','stats','settings'];
function switchNav(name){
  panels.forEach(p=>document.getElementById('panel-'+p).style.display='none');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('[data-tab]').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).style.display=name==='today'?'block':'flex';
  document.querySelector(`[data-nav="${name}"]`).classList.add('active');
  document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');
}
document.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>switchNav(t.dataset.tab)));

const now=new Date();
document.getElementById('headerDate').textContent=`${now.getMonth()+1}/${now.getDate()}`;
switchNav('today');
render();
</script>
</body>
</html>
